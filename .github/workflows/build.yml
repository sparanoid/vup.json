name: Build

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'master'
  schedule:
    - cron: '21 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Serialise runs so an hourly build never races a push for the same commit.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Update list
        run: uv run --locked main.py

      - name: Check whether dist/vup.json changed
        id: changed
        run: |
          if git diff --quiet -- dist/vup.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        if: github.event_name != 'pull_request'
        with:
          gpg_private_key: ${{ secrets.GPG_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - uses: signcl/git-auto-commit-action@master
        if: github.event_name != 'pull_request'
        with:
          commit_message: "chore: update list"
          commit_options: "-S"
          commit_user_name: Sparanoid Bot
          commit_user_email: bot@sparanoid.com
          commit_author: Sparanoid Bot <bot@sparanoid.com>
          branch: master

      - name: Notify bilibili-space
        if: ${{ github.event_name != 'pull_request' && steps.changed.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PAT_SPARANOID }}
        run: gh api repos/sparanoid/bilibili-space/dispatches -f event_type=webhook
